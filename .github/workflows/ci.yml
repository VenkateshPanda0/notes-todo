name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # pywebview/pyinstaller are packaging-only and Windows-oriented, so skip them here.
      - run: pip install "fastapi>=0.115,<1.0" "uvicorn[standard]" "pytest>=8,<9" "httpx>=0.27" "sqlalchemy>=2,<3" "sqlcipher3-wheels>=0.5.5"
      - run: python -m pytest backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Builds the app as a single executable (as the release does, but on Linux) and runs its built-in
  # smoke test, so a change that breaks packaging fails here instead of at release time.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm ci
          npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # pywebview is the desktop window and can't be built on a headless runner; the smoke test skips
      # its import here (the Windows release build checks it).
      - run: pip install "fastapi>=0.115,<1.0" "uvicorn[standard]" "httpx>=0.27" "sqlalchemy>=2,<3" "sqlcipher3-wheels>=0.5.5" "pyinstaller>=6,<7"
      - name: Build the executable
        working-directory: backend
        run: pyinstaller --noconfirm --clean --name TaskFlow --onefile --add-data "../frontend/dist:frontend/dist" launcher.py
      - name: Smoke test the executable
        working-directory: backend
        env:
          TASKFLOW_SMOKE_SKIP_WEBVIEW: "1"
        run: ./dist/TaskFlow --smoke-test --report smoke-report.txt
