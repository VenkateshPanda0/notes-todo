name: Release

# Pushing a version tag builds the Windows app, verifies it, and publishes a GitHub Release:
#     git tag v0.1.0 && git push origin v0.1.0
# Running the workflow by hand (Actions tab -> Release -> Run workflow) does a full dry run that
# builds and tests the exe and uploads it as a workflow artifact, without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install "fastapi>=0.115,<1.0" "uvicorn[standard]" "pytest>=8,<9" "httpx>=0.27" "sqlalchemy>=2,<3"
      - run: python -m pytest backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build-windows:
    name: Build Windows app
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build TaskFlow.exe
        working-directory: backend
        run: >
          pyinstaller --noconfirm --clean --name TaskFlow --onefile --windowed
          --icon taskflow.ico
          --add-data "../frontend/dist;frontend/dist"
          launcher.py

      # The exe is a windowed app (no console), so the smoke test reports through a file and its
      # exit code. It starts the bundled server, exercises the API and database, and checks the UI
      # and pywebview were packaged.
      - name: Smoke test the exe
        shell: pwsh
        working-directory: backend
        run: |
          $report = Join-Path $PWD "smoke-report.txt"
          $process = Start-Process -FilePath "dist\TaskFlow.exe" `
            -ArgumentList "--smoke-test", "--report", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No report was written." }
          $log = Join-Path $env:APPDATA "TaskFlow\taskflow.log"
          if (Test-Path $log) { Write-Host "--- taskflow.log ---"; Get-Content $log }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed (exit code $($process.ExitCode))." }

      - name: Name and checksum the release files
        shell: pwsh
        working-directory: backend
        run: |
          $name = "TaskFlow-$env:VERSION-windows-x64.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\TaskFlow.exe "release\$name"
          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "release\$name.sha256"
          Get-Content "release\$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-${{ env.VERSION }}-windows-x64
          path: backend/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install
            Download the `.exe` below and run it. There is nothing to install, and your data stays on your machine.

            Windows may show a **SmartScreen** warning because the app is not code-signed yet: choose **More info → Run anyway**. You can verify the download against the `.sha256` file.

            Requires Windows 10/11 with the Microsoft Edge WebView2 runtime (already included in current Windows).
